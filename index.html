<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Metronome">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Metronome</title>
<style>
  :root {
    --bg: #0c0b09;
    --panel: #161410;
    --line: #2c2924;
    --text: #f2eee6;
    --muted: #8a8478;
    --gold: #d4b07a;
    --gold-dim: #7a6240;
    --lit: #ffe3a8;
    --unlit: #2a2722;
    --stop: #c45c4a;
    --go-bg: #d4b07a;
    --go-fg: #1a140c;
    --danger-bg: #8a3d32;
    --danger-fg: #f6e8e4;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a2218 0%, transparent 55%),
      var(--bg);
  }
  .app {
    width: min(520px, 100%);
    padding: 18px 20px calc(18px + var(--safe));
    display: flex; flex-direction: column; gap: 18px;
    min-height: 100%;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    font-size: 11px; letter-spacing: 0.28em; font-weight: 600;
    color: var(--gold); text-transform: uppercase;
  }
  .countin {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer;
    padding: 8px 4px; min-height: 44px;
  }
  .countin input { accent-color: var(--gold); width: 16px; height: 16px; }
  .countin.on { color: var(--gold); }

  .stage {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0 4px;
  }
  .in-badge {
    height: 18px; font-size: 11px; letter-spacing: 0.22em;
    color: var(--gold); text-transform: uppercase; opacity: 0;
    transition: opacity 80ms linear; margin-bottom: 6px;
  }
  .in-badge.show { opacity: 1; }
  .lights {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 10px; min-height: 28px; max-width: 100%;
  }
  .lights.many { gap: 7px; }
  .light {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--unlit);
    box-shadow: inset 0 1px 2px #0009;
    transition: background 50ms linear, box-shadow 50ms linear, transform 50ms linear;
  }
  .light.down { width: 17px; height: 17px; border-radius: 4px; }
  .lights.many .light { width: 11px; height: 11px; }
  .lights.many .light.down { width: 13px; height: 13px; }
  .light.on {
    background: var(--gold);
    box-shadow: 0 0 12px #e8c48a88;
    transform: scale(1.28);
  }
  .light.on.down {
    background: var(--lit);
    box-shadow: 0 0 18px #e8c48acc;
  }

  .beat-num {
    font-size: clamp(56px, 16vw, 84px);
    font-weight: 600; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1; margin-top: 10px;
    color: var(--text); opacity: 0.22;
    transition: opacity 60ms linear, transform 60ms linear, color 60ms linear;
  }
  .beat-num.live { opacity: 1; }
  .beat-num.flash { transform: scale(1.04); color: var(--lit); }

  .bpm-wrap {
    display: flex; flex-direction: column; align-items: center; margin-top: 6px;
  }
  .bpm-wrap.pulse #bpm { transform: scale(1.03); color: var(--lit); }
  #bpm {
    appearance: textfield; -moz-appearance: textfield;
    background: transparent; border: 0; outline: none;
    color: var(--text); font: inherit;
    font-size: clamp(64px, 18vw, 92px);
    font-weight: 650; letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    width: 3.4ch; text-align: center; line-height: 1;
    user-select: text; -webkit-user-select: text;
    caret-color: var(--gold);
    transition: transform 70ms ease, color 70ms linear;
  }
  #bpm::-webkit-outer-spin-button, #bpm::-webkit-inner-spin-button { appearance: none; margin: 0; }
  .bpm-label {
    font-size: 11px; letter-spacing: 0.32em; color: var(--muted);
    margin-top: 4px; text-transform: uppercase;
  }

  .tempo-row {
    display: grid; grid-template-columns: 56px 1fr 56px;
    gap: 10px; align-items: center;
  }
  .step {
    height: 48px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 10px; font-size: 24px; cursor: pointer;
  }
  .step:active { background: #24211c; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; background: var(--line); border-radius: 99px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--gold); border: 0; cursor: pointer;
    box-shadow: 0 0 0 4px #d4b07a22;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--gold); border: 0; cursor: pointer;
  }
  .tap-row { display: flex; justify-content: center; }
  .tap {
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); letter-spacing: 0.2em; font-size: 12px;
    text-transform: uppercase; padding: 10px 22px; border-radius: 999px;
    cursor: pointer; min-height: 44px;
  }
  .tap:active, .tap.hit { color: var(--gold); border-color: var(--gold-dim); }

  .section-label {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; cursor: pointer; min-height: 40px; min-width: 48px;
  }
  .chip.on { border-color: var(--gold); color: var(--gold); background: #1e1a14; }
  .sig-extra {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 10px; flex-wrap: wrap;
  }
  .beats-ctrl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .beats-ctrl button {
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer;
  }
  .beats-ctrl strong { color: var(--text); min-width: 2.4ch; text-align: center; display: inline-block; }
  .pulse-toggle { display: none; gap: 6px; }
  .pulse-toggle.show { display: flex; }
  .pulse-toggle button {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer; min-height: 40px;
  }
  .pulse-toggle button.on { color: var(--gold); border-color: var(--gold); }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  }
  .seg button {
    height: 48px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 15px; cursor: pointer;
  }
  .seg button.on { background: #241f18; border-color: var(--gold); color: var(--gold); font-weight: 600; }

  .subdiv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .subdiv button {
    height: 44px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .subdiv button.on { color: var(--gold); border-color: var(--gold); }

  .vols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .vol label {
    display: flex; justify-content: space-between; font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }

  .start {
    height: 64px; width: 100%; border: 0; border-radius: 14px;
    background: var(--go-bg); color: var(--go-fg);
    font-size: 18px; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; cursor: pointer;
    box-shadow: 0 8px 24px #d4b07a22;
  }
  .start.running {
    background: var(--danger-bg); color: var(--danger-fg);
    box-shadow: none;
  }
  .hint {
    text-align: center; color: #5e5a52; font-size: 11px; letter-spacing: 0.04em;
    line-height: 1.5; padding-bottom: 4px;
  }
  .load-err {
    display: none; color: #e08a7a; font-size: 13px; text-align: center;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Metronome</div>
      <label class="countin" id="countinLabel">
        <input type="checkbox" id="countIn"> Count-in
      </label>
    </header>

    <div class="stage">
      <div class="in-badge" id="inBadge">Count in</div>
      <div class="lights" id="lights"></div>
      <div class="beat-num" id="beatNum">&nbsp;</div>
      <div class="bpm-wrap" id="bpmWrap">
        <input id="bpm" type="number" min="30" max="300" step="1" value="120" inputmode="numeric">
        <div class="bpm-label">BPM</div>
      </div>
    </div>

    <div>
      <div class="tempo-row">
        <button class="step" id="bpmDown" aria-label="Slower">−</button>
        <input type="range" id="bpmSlider" min="30" max="300" value="120">
        <button class="step" id="bpmUp" aria-label="Faster">+</button>
      </div>
      <div class="tap-row" style="margin-top:12px">
        <button class="tap" id="tap">Tap</button>
      </div>
    </div>

    <div>
      <div class="section-label">Time signature</div>
      <div class="chips" id="presets"></div>
      <div class="sig-extra">
        <div class="beats-ctrl">
          Beats
          <button id="beatsDown" aria-label="Fewer beats">−</button>
          <strong id="beatsVal">4</strong>
          <button id="beatsUp" aria-label="More beats">+</button>
        </div>
        <div class="pulse-toggle" id="pulseToggle">
          <button data-pulse="beat" class="on">Every beat</button>
          <button data-pulse="dotted">Dotted pulse</button>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Voice</div>
      <div class="seg" id="modes">
        <button data-mode="count" class="on">Count</button>
        <button data-mode="one">One</button>
        <button data-mode="click">Click</button>
      </div>
    </div>

    <div>
      <div class="section-label">Subdivisions</div>
      <div class="subdiv" id="subdivs">
        <button data-sub="1" class="on">Off</button>
        <button data-sub="2">Eighths</button>
        <button data-sub="3">Triplets</button>
        <button data-sub="4">Sixteenths</button>
      </div>
    </div>

    <div class="vols">
      <div class="vol">
        <label>Voice <span id="voicePct">85</span></label>
        <input type="range" id="voiceVol" min="0" max="100" value="85">
      </div>
      <div class="vol">
        <label>Clicks <span id="clickPct">55</span></label>
        <input type="range" id="clickVol" min="0" max="100" value="55">
      </div>
    </div>

    <button class="start" id="start">Start</button>
    <div class="load-err" id="loadErr"></div>
    <div class="hint">space start/stop · ↑↓ bpm · shift+↑↓ ±5 · 1 2 3 mode · t tap · s subdiv · c count-in</div>
  </div>

const PRESETS = [
  {b:2,d:4},{b:3,d:4},{b:4,d:4},{b:5,d:4},
  {b:6,d:8},{b:7,d:8},{b:9,d:8},{b:12,d:8}
];
const LOOKAHEAD = 0.025;
const SCHEDULE_AHEAD = 0.12;
const STORE = "keenan-metronome-v1";

const state = {
  bpm: 120,
  beats: 4,
  denom: 4,
  pulse: "beat",
  voiceMode: "count",
  subdiv: 1,
  voiceVol: 0.85,
  clickVol: 0.55,
  countIn: false
};

let audioCtx = null, masterGain, voiceGain, clickGain;
let buffers = {};
let running = false;
let nextNoteTime = 0;
let currentBeat = 0;
let timerID = null;
let countingIn = false;
let uiEvents = [];
let lastUI = { beat: 0, time: -1, countingIn: false };
let taps = [];
let ready = false;

const $ = id => document.getElementById(id);
const bpmInput = $("bpm");
const bpmSlider = $("bpmSlider");
const lightsEl = $("lights");
const beatNumEl = $("beatNum");
const startBtn = $("start");
const bpmWrap = $("bpmWrap");
const inBadge = $("inBadge");

function isCompound() {
  return state.denom === 8 && (state.beats === 6 || state.beats === 9 || state.beats === 12);
}
function effectiveBeats() {
  if (state.pulse === "dotted" && isCompound()) return state.beats / 3;
  return state.beats;
}
function secondsPerBeat() { return 60.0 / state.bpm; }
function clampBpm(n) { return Math.min(300, Math.max(30, Math.round(n))); }
function isTyping() {
  const t = document.activeElement;
  return t && (t.tagName === "INPUT" && t.type === "number");
}

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    voiceGain = audioCtx.createGain();
    clickGain = audioCtx.createGain();
    voiceGain.connect(masterGain);
    clickGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
    const names = Object.keys(SAMPLES);
    await Promise.all(names.map(async name => {
      const buf = b64ToArrayBuffer(SAMPLES[name]);
      buffers[name] = await audioCtx.decodeAudioData(buf.slice(0));
    }));
    ready = true;
  }
  if (audioCtx.state === "suspended") await audioCtx.resume();
  applyGains();
}

function applyGains() {
  if (!audioCtx) return;
  const curve = v => Math.pow(v, 1.4);
  voiceGain.gain.setTargetAtTime(curve(state.voiceVol), audioCtx.currentTime, 0.02);
  clickGain.gain.setTargetAtTime(curve(state.clickVol), audioCtx.currentTime, 0.02);
}

function playBuf(name, time, dest, mul) {
  const buf = buffers[name];
  if (!buf) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  if (mul !== 1) {
    const g = audioCtx.createGain();
    g.gain.value = mul;
    src.connect(g);
    g.connect(dest);
  } else {
    src.connect(dest);
  }
  src.start(time);
}

function scheduleNote(time, beatIndex) {
  const beatNum = beatIndex + 1;
  const down = beatIndex === 0;
  const mode = state.voiceMode;
  const speakAll = mode === "count";
  const speakOne = mode === "one" && down;

  if (speakAll || speakOne) {
    playBuf("n" + beatNum, time, voiceGain, 1);
    playBuf(down ? "click_accent" : "click_beat", time, clickGain, 0.28);
  } else {
    playBuf(down ? "click_accent" : "click_beat", time, clickGain, 1);
  }

  const sub = state.subdiv;
  if (sub > 1) {
    const spb = secondsPerBeat();
    for (let s = 1; s < sub; s++) {
      playBuf("click_sub", time + (spb / sub) * s, clickGain, 0.7);
    }
  }

  uiEvents.push({ time, beat: beatNum, countingIn, total: effectiveBeats() });
  if (uiEvents.length > 64) uiEvents.splice(0, uiEvents.length - 32);
}

function advance() {
  nextNoteTime += secondsPerBeat();
  currentBeat += 1;
  if (currentBeat >= effectiveBeats()) {
    currentBeat = 0;
    if (countingIn) countingIn = false;
  }
}

function scheduler() {
  if (!audioCtx || !running) return;
  while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
    scheduleNote(nextNoteTime, currentBeat);
    advance();
  }
}

async function start() {
  try {
    await ensureAudio();
  } catch (err) {
    $("loadErr").style.display = "block";
    $("loadErr").textContent = "Could not load audio: " + err.message;
    return;
  }
  running = true;
  currentBeat = 0;
  countingIn = !!state.countIn;
  uiEvents = [];
  lastUI = { beat: 0, time: -1, countingIn };
  nextNoteTime = audioCtx.currentTime + 0.07;
  startBtn.textContent = "Stop";
  startBtn.classList.add("running");
  scheduler();
  const tick = () => {
    scheduler();
    if (running) timerID = setTimeout(tick, LOOKAHEAD * 1000);
  };
  timerID = setTimeout(tick, LOOKAHEAD * 1000);
}

function stop() {
  running = false;
  countingIn = false;
  if (timerID) { clearTimeout(timerID); timerID = null; }
  startBtn.textContent = "Start";
  startBtn.classList.remove("running");
  lastUI = { beat: 0, time: -1, countingIn: false };
  paintVisuals(0, false, false);
}

function toggle() { running ? stop() : start(); }

function setBpm(n, fromInput) {
  state.bpm = clampBpm(n);
  if (!fromInput) bpmInput.value = state.bpm;
  bpmSlider.value = state.bpm;
  save();
}

function setBeats(n, denom) {
  state.beats = Math.min(16, Math.max(1, n | 0));
  if (denom) state.denom = denom;
  if (!isCompound()) state.pulse = "beat";
  if (currentBeat >= effectiveBeats()) currentBeat = 0;
  $("beatsVal").textContent = state.beats;
  renderPresets();
  renderPulse();
  renderLights();
  save();
}

function renderPresets() {
  const el = $("presets");
  el.innerHTML = "";
  PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip" + (p.b === state.beats && p.d === state.denom ? " on" : "");
    b.textContent = p.b + "/" + p.d;
    b.onclick = () => setBeats(p.b, p.d);
    el.appendChild(b);
  });
}

function renderPulse() {
  const wrap = $("pulseToggle");
  wrap.classList.toggle("show", isCompound());
  wrap.querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.pulse === state.pulse);
  });
}

function renderLights() {
  const n = effectiveBeats();
  lightsEl.innerHTML = "";
  lightsEl.classList.toggle("many", n > 8);
  for (let i = 1; i <= n; i++) {
    const d = document.createElement("div");
    d.className = "light" + (i === 1 ? " down" : "");
    d.dataset.beat = String(i);
    lightsEl.appendChild(d);
  }
  paintVisuals(running ? lastUI.beat : 0, false, false);
}

function paintVisuals(beat, flash, inBar) {
  const lights = lightsEl.children;
  for (let i = 0; i < lights.length; i++) {
    lights[i].classList.toggle("on", running && (i + 1) === beat);
  }
  if (running && beat) {
    beatNumEl.textContent = String(beat);
    beatNumEl.classList.add("live");
    beatNumEl.classList.toggle("flash", flash);
  } else {
    beatNumEl.textContent = "\u00a0";
    beatNumEl.classList.remove("live", "flash");
  }
  bpmWrap.classList.toggle("pulse", running && flash);
  inBadge.classList.toggle("show", running && inBar);
}

function draw() {
  if (running && audioCtx) {
    const now = audioCtx.currentTime;
    while (uiEvents.length && uiEvents[0].time <= now) {
      lastUI = uiEvents.shift();
    }
    const flash = lastUI.time >= 0 && (now - lastUI.time) < 0.11;
    paintVisuals(lastUI.beat, flash, lastUI.countingIn);
  }
  requestAnimationFrame(draw);
}

function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const s = JSON.parse(raw);
    Object.assign(state, {
      bpm: clampBpm(s.bpm || 120),
      beats: Math.min(16, Math.max(1, s.beats || 4)),
      denom: s.denom === 8 ? 8 : 4,
      pulse: s.pulse === "dotted" ? "dotted" : "beat",
      voiceMode: ["count","one","click"].includes(s.voiceMode) ? s.voiceMode : "count",
      subdiv: [1,2,3,4].includes(s.subdiv) ? s.subdiv : 1,
      voiceVol: typeof s.voiceVol === "number" ? s.voiceVol : 0.85,
      clickVol: typeof s.clickVol === "number" ? s.clickVol : 0.55,
      countIn: !!s.countIn
    });
  } catch (e) {}
}

function syncUI() {
  bpmInput.value = state.bpm;
  bpmSlider.value = state.bpm;
  $("beatsVal").textContent = state.beats;
  $("countIn").checked = state.countIn;
  $("countinLabel").classList.toggle("on", state.countIn);
  $("voiceVol").value = Math.round(state.voiceVol * 100);
  $("clickVol").value = Math.round(state.clickVol * 100);
  $("voicePct").textContent = Math.round(state.voiceVol * 100);
  $("clickPct").textContent = Math.round(state.clickVol * 100);
  $("modes").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === state.voiceMode));
  $("subdivs").querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.sub) === state.subdiv));
  renderPresets();
  renderPulse();
  renderLights();
}

function holdRepeat(el, fn) {
  let delay, iv;
  const begin = e => {
    e.preventDefault();
    fn();
    delay = setTimeout(() => { iv = setInterval(fn, 55); }, 340);
  };
  const end = () => { clearTimeout(delay); clearInterval(iv); };
  el.addEventListener("pointerdown", begin);
  ["pointerup","pointerleave","pointercancel"].forEach(ev => el.addEventListener(ev, end));
}

function tapTempo() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  $("tap").classList.add("hit");
  setTimeout(() => $("tap").classList.remove("hit"), 90);
  if (taps.length < 2) return;
  const recent = taps.slice(-8);
  let sum = 0;
  for (let i = 1; i < recent.length; i++) sum += recent[i] - recent[i - 1];
  setBpm(60000 / (sum / (recent.length - 1)));
}

holdRepeat($("bpmDown"), () => setBpm(state.bpm - 1));
holdRepeat($("bpmUp"), () => setBpm(state.bpm + 1));
holdRepeat($("beatsDown"), () => {
  const n = state.beats - 1;
  const match = PRESETS.find(p => p.b === n);
  setBeats(n, match ? match.d : state.denom);
});
holdRepeat($("beatsUp"), () => {
  const n = state.beats + 1;
  const match = PRESETS.find(p => p.b === n);
  setBeats(n, match ? match.d : state.denom);
});

bpmSlider.addEventListener("input", e => setBpm(Number(e.target.value)));
bpmInput.addEventListener("change", e => {
  setBpm(Number(e.target.value) || state.bpm);
  bpmInput.value = state.bpm;
});
bpmInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { bpmInput.blur(); e.preventDefault(); }
});

$("tap").addEventListener("click", tapTempo);
$("countIn").addEventListener("change", e => {
  state.countIn = e.target.checked;
  $("countinLabel").classList.toggle("on", state.countIn);
  save();
});
$("pulseToggle").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  state.pulse = b.dataset.pulse;
  if (currentBeat >= effectiveBeats()) currentBeat = 0;
  renderPulse();
  renderLights();
  save();
});
$("modes").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  state.voiceMode = b.dataset.mode;
  $("modes").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  save();
});
$("subdivs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  state.subdiv = Number(b.dataset.sub);
  $("subdivs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  save();
});
$("voiceVol").addEventListener("input", e => {
  state.voiceVol = Number(e.target.value) / 100;
  $("voicePct").textContent = e.target.value;
  applyGains(); save();
});
$("clickVol").addEventListener("input", e => {
  state.clickVol = Number(e.target.value) / 100;
  $("clickPct").textContent = e.target.value;
  applyGains(); save();
});
startBtn.addEventListener("click", toggle);

window.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (isTyping() && e.code !== "Space") return;
  if (e.code === "Space") {
    e.preventDefault();
    toggle();
  } else if (e.code === "ArrowUp") {
    e.preventDefault();
    setBpm(state.bpm + (e.shiftKey ? 5 : 1));
  } else if (e.code === "ArrowDown") {
    e.preventDefault();
    setBpm(state.bpm - (e.shiftKey ? 5 : 1));
  } else if (e.key === "1" && !isTyping()) {
    state.voiceMode = "count"; syncUI(); save();
  } else if (e.key === "2" && !isTyping()) {
    state.voiceMode = "one"; syncUI(); save();
  } else if (e.key === "3" && !isTyping()) {
    state.voiceMode = "click"; syncUI(); save();
  } else if (e.key === "t" || e.key === "T") {
    e.preventDefault(); tapTempo();
  } else if (e.key === "s" || e.key === "S") {
    state.subdiv = state.subdiv === 4 ? 1 : state.subdiv + 1;
    syncUI(); save();
  } else if (e.key === "c" || e.key === "C") {
    state.countIn = !state.countIn; syncUI(); save();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && audioCtx && audioCtx.state === "running") {
    /* keep going — practice apps should not stop in background if allowed */
  }
});

load();
syncUI();
draw();
</script>
</body>
</html>
